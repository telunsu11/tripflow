name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Tests (offline, no keys required)
        run: uv run pytest
      - name: CLI smoke (doctor; key checks fail gracefully)
        run: uv run tripflow doctor --no-mcp --allow-missing
