[project]
name = "tripflow"
version = "0.1.0"
description = "输入预算和日期，产出数字真实、可执行、可分享的旅行行程单（12306 + 高德 + 任意 OpenAI 兼容 LLM）"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "tripflow contributors" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "openai>=1.35",
    "mcp>=1.2",
    "qrcode[pil]>=8.0",
    "jinja2>=3.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
tripflow = "tripflow.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
